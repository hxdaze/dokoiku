<body>
  <header>
    <div class="toolbar">
      <a class="brand" href="./" aria-label="どこジム♪ ホーム">
        <img src="logo.png" alt="どこジム♪ 全国スタジオレッスン検索サイト" class="brand-logo" />
      </a>
      <div class="toolbar-right">
        <span class="sub" id="metaSub">読み込み中…</span>
        <button class="theme-toggle" id="themeToggle" type="button"
                title="配色を切り替え" aria-label="配色を切り替え">🎨</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="day">📅 曜日別</button>
      <button class="tab" data-view="timeband">⏰ 時間帯別</button>
      <button class="tab" data-view="store">🏠 店舗別</button>
      <button class="tab" data-view="category">🏷️ カテゴリー別</button>
      <button class="tab" data-view="instructor">🧑‍🏫 先生別</button>
      <button class="tab" data-view="hashigo">🪜 はしご</button>
      <button class="tab" data-view="gym">🏢 ジム別</button>
      <button class="tab" data-view="substitution">🔁 代行情報</button>
      <button class="tab" data-view="map">🗺️ 近くで探す</button>
    </nav>
  </header>

  <section class="filters" id="filters">
    <div class="field">
      <label>エリア（地域）</label>
      <select id="f-region"><option value="">すべて</option></select>
    </div>
    <div class="field">
      <label>都道府県</label>
      <select id="f-prefecture"><option value="">すべて</option></select>
    </div>
    <div class="field">
      <label>ジム</label>
      <select id="f-gym"><option value="">すべて</option></select>
    </div>
    <div class="field" data-for="day">
      <label>曜日</label>
      <select id="f-day"><option value="">すべて</option></select>
    </div>
    <div class="field" data-for="category">
      <label>カテゴリー</label>
      <select id="f-category"><option value="">すべて</option></select>
    </div>
    <div class="field" data-for="store">
      <label>店舗</label>
      <select id="f-store"><option value="">すべて</option></select>
    </div>
    <div class="field" data-for="instructor">
      <label>先生</label>
      <select id="f-instructor"><option value="">すべて</option></select>
    </div>
    <div class="field">
      <label>フリーワード</label>
      <input class="q" id="f-q" type="search" placeholder="クラス名・先生・店舗…" />
    </div>
    <div class="field">
      <label>表示件数</label>
      <select id="f-limit">
        <option value="200">200件</option>
        <option value="500">500件</option>
        <option value="1000">1000件</option>
        <option value="0">制限なし</option>
      </select>
    </div>
    <button class="btn" id="resetBtn">クリア</button>
  </section>

  <div class="summary" id="summary"></div>
  <main id="main"><div class="loading">読み込み中…</div></main>
  <footer style="padding:18px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);">
    <p style="margin:0 0 8px;color:#c0392b;font-weight:600;">
      ※掲載内容が間違っている場合があります。ジムのホームページを参照の上、ご参加ください。
    </p>
    どこジム♪（愛称：どこずむ♪）｜ データは各ジム公式サイトの公開情報をもとに構造化。生成日時は上部に表示。

  </footer>
